name: Update Git Koi

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  update-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: erik-kruus/git-profile-koi@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi.gif README.md
          git commit -m "chore: update git-koi pixel art" || echo "No changes to commit"
          git push
